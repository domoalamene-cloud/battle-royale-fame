<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Royale Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>BATTLE ROYALE</h1>
  <p id="status">Connecting to server...</p>
  <p>Players online: <span id="playerCount">0</span></p>  <div id="game">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>  <div id="controls">
    <button id="up">⬆️</button><br>
    <button id="left">⬅️</button>
    <button id="fire">🔥 FIRE</button>
    <button id="right">➡️</button><br>
    <button id="down">⬇️</button>
  </div>  <script src="/socket.io/socket.io.js"></script>  <script src="game.js"></script></body>
</html>
